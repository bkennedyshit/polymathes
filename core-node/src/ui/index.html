<script>
const e = React.createElement;
window.__POLYMATH_TOKEN__ = "__POLYMATH_TOKEN__";

function getToken() {
  if (window.__POLYMATH_TOKEN__ && window.__POLYMATH_TOKEN__ !== '__POLYMATH_TOKEN__') {
    localStorage.setItem('polymath_token', window.__POLYMATH_TOKEN__);
    return window.__POLYMATH_TOKEN__;
  }
  let t = localStorage.getItem('polymath_token');
  if (!t) { t = prompt('Enter bearer token:'); if (t) localStorage.setItem('polymath_token', t); }
  return t || '';
}
let TOKEN = getToken();
function authHeaders() { return { 'Authorization': 'Bearer ' + TOKEN }; }
function jsonHeaders() { return { ...authHeaders(), 'Content-Type': 'application/json' }; }

async function api(path, init) {
  const opts = { ...init, headers: { ...(init?.body ? jsonHeaders() : authHeaders()), ...(init?.headers || {}) } };
  const res = await fetch(path, opts);
  if (res.status === 401) {
    localStorage.removeItem('polymath_token');
    TOKEN = prompt('Polymath local token changed. Paste bearer token from ~/.polymath/auth.key:') || '';
    if (TOKEN) localStorage.setItem('polymath_token', TOKEN);
    const retry = await fetch(path, { ...init, headers: { ...(init?.body ? jsonHeaders() : authHeaders()), ...(init?.headers || {}) } });
    if (retry.ok) {
      const ct = retry.headers.get('content-type') || '';
      return ct.includes('application/json') ? retry.json() : retry.text();
    }
    let retryMsg = retry.status + ' ' + retry.statusText;
    try { const j = await retry.json(); retryMsg = j.error || retryMsg; } catch {}
    throw new Error(retryMsg);
  }
  if (!res.ok) { let msg = res.status + ' ' + res.statusText; try { const j = await res.json(); msg = j.error || msg; } catch {} throw new Error(msg); }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

async function authedBlobUrl(path) {
  const res = await fetch(path, { headers: authHeaders() });
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return URL.createObjectURL(await res.blob());
}

function mediaFilePath(item, extra = '') {
  return '/api/media/' + item.id + '/file' + (extra ? '?' + extra : '');
}

function mediaPlayablePath(item) {
  if (item?.kind === 'video') return '/api/media/' + item.id + '/preview.mp4';
  return mediaFilePath(item);
}

function useFetch(url, deps = []) {
  const [data, setData] = React.useState(null);
  const [err, setErr] = React.useState(null);
  const reload = React.useCallback(() => { setData(null); api(url).then(setData).catch(x => { setErr(x.message); setData([]); }); }, [url]);
  React.useEffect(() => { reload(); }, [reload, ...deps]);
  return [data, err, reload];
}

// ---------- Toast ----------
let toastId = 0;
function toast(msg, kind = 'info') {
  const id = ++toastId;
  const root = document.getElementById('toast-root');
  const div = document.createElement('div');
  const color = kind === 'error' ? 'bg-red-900 border-red-700 text-red-100' :
                kind === 'success' ? 'bg-green-900 border-green-700 text-green-100' :
                'bg-bg-700 border-bg-600 text-gray-100';
  div.className = 'toast px-4 py-2 rounded-lg border text-sm shadow-lg ' + color;
  div.textContent = msg;
  div.dataset.id = id;
  root.appendChild(div);
  setTimeout(() => { div.style.opacity = '0'; div.style.transition = 'opacity 0.3s'; setTimeout(() => div.remove(), 300); }, 3500);
}

// ---------- Header/logo ----------
function Logo() {

    e('div', { className: 'w-9 h-9 rounded-lg bg-gradient-to-br from-accent to-accent-dim flex items-center justify-center font-bold text-lg text-bg-900' }, 'Π'),

function StatusBar({ doctor }) {
  if (!doctor) return null;
  const mcp = doctor.mcp_servers || [];
  const mcpUp = mcp.filter(s => s.health === 'connected').length;
  const allGood = doctor.gateway === 'ok' && doctor.db === 'ok' && mcpUp === mcp.length;
  return e('div', { className: 'flex items-center gap-3 px-4 py-2 border-t border-bg-700 text-[11px] mono text-gray-400' },
    e('span', { className: 'flex items-center gap-1' }, e('span', { className: 'w-2 h-2 rounded-full pulse-dot ' + (allGood ? 'bg-green-500' : 'bg-yellow-500') }), allGood ? 'healthy' : 'degraded'),

    e('span', null, doctor.tools, ' tools'),
    e('span', null, '·'),
    e('span', null, mcpUp, '/', mcp.length, ' mcp'),
    e('span', null, '·'),
    e('span', null, Math.floor(doctor.uptime_seconds / 60), 'm up')

}

// ---------- Model picker (top right) ----------
function ModelPicker({ current, onChange }) {
  const [open, setOpen] = React.useState(false);
  const [data, setData] = React.useState(null);
  const ref = React.useRef(null);
  React.useEffect(() => { if (open) api('/api/models').then(setData).catch(() => setData({ models: [] })); }, [open]);
  // Close on outside click + Escape so clicking to the side dismisses it.
  React.useEffect(() => {
    if (!open) return;
    const onDocClick = (ev) => { if (ref.current && !ref.current.contains(ev.target)) setOpen(false); };
    const onKey = (ev) => { if (ev.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDocClick); document.removeEventListener('keydown', onKey); };
  }, [open]);
  return e('div', { className: 'relative', ref },
    e('button', {
      className: 'flex items-center gap-2 px-3 py-1.5 rounded-md bg-bg-700 hover:bg-bg-600 text-sm mono border border-bg-600',
      onClick: () => setOpen(!open),
    },
      e('span', { className: 'w-2 h-2 rounded-full bg-accent' }),
      current?.provider || '…', e('span', { className: 'text-gray-500' }, '/'), e('span', { className: 'text-white' }, current?.model || '…'),
      e('span', { className: 'text-gray-500 ml-1' }, open ? '▴' : '▾')
    ),
    open && e('div', { className: 'absolute right-0 top-full mt-1 w-72 bg-bg-700 border border-bg-600 rounded-md shadow-xl z-50 max-h-96 overflow-y-auto scrollbar-thin' },
      !data ? e('div', { className: 'p-3 text-sm text-gray-400' }, 'Loading…') :
      e(React.Fragment, null,
        e('div', { className: 'p-2 border-b border-bg-600 text-[10px] uppercase tracking-wide text-gray-500 mono' }, data.provider + ' models'),
        !data.models?.length ? e('div', { className: 'p-3 text-sm text-gray-400' }, 'None found. Check provider settings.') :

            key: m,
            className: 'w-full text-left px-3 py-2 text-sm hover:bg-bg-600 mono ' + (m === current?.model ? 'text-accent' : 'text-gray-200'),

              try { await api('/api/settings/llm', { method: 'POST', body: JSON.stringify({ model: m }) }); onChange?.(); toast('Model: ' + m, 'success'); }
              catch (err) { toast(err.message, 'error'); }
              setOpen(false);
            },
          }, m === current?.model ? '✓ ' + m : '  ' + m))
      )
    )
  );
}

function renderMd(text) {
  try { return { __html: marked.parse(text || '') }; }
  catch { return { __html: (text || '').replace(/</g, '&lt;') }; }
}

function prettyJson(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
}

// ---------- Chat with live tool-call trace via SSE ----------
function ChatPanel() {
  const [msgs, setMsgs] = React.useState(() => {
    try { return JSON.parse(sessionStorage.getItem('chat_msgs') || '[]'); } catch { return []; }
  });
  const [input, setInput] = React.useState('');
  const [sessionId, setSessionId] = React.useState(() => sessionStorage.getItem('chat_session') || null);
  const [thinking, setThinking] = React.useState(false);
  const [trace, setTrace] = React.useState([]); // current in-flight events
  const [attachments, setAttachments] = React.useState([]);
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    sessionStorage.setItem('chat_msgs', JSON.stringify(msgs.slice(-50)));
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, trace]);

  const handleFiles = async (files) => {
    for (const file of files) {
      try {
        const fd = new FormData();
        fd.append('file', file);
        if (sessionId) fd.append('sessionId', sessionId);
        const r = await fetch('/api/attachments', { method: 'POST', headers: authHeaders(), body: fd });
        const j = await r.json();
        if (r.ok) setAttachments(a => [...a, { name: file.name, path: j.path, size: j.size }]);
        else toast(j.error || 'upload failed', 'error');
      } catch (err) { toast(err.message, 'error'); }
    }
  };

  const send = async () => {
    if (!input.trim() || thinking) return;
    let text = input.trim();
    if (attachments.length > 0) {
      text += '\n\n[Attached files]\n' + attachments.map(a => '- ' + a.path).join('\n');
    }
    setInput('');
    setAttachments([]);
    setMsgs(m => [...m, { role: 'user', text, ts: Date.now() }]);
    setThinking(true);
    setTrace([]);

    try {
      const res = await fetch('/api/chat/stream', {
        method: 'POST', headers: jsonHeaders(),
        body: JSON.stringify({ text, sessionId }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let finalAnswer = '';
      const localTrace = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          if (!raw.trim()) continue;
          const lines = raw.split('\n');
          let evt = 'message', data = '';
          for (const l of lines) {
            if (l.startsWith('event:')) evt = l.slice(6).trim();
            else if (l.startsWith('data:')) data += l.slice(5).trim();
          }
          let parsed; try { parsed = JSON.parse(data); } catch { parsed = { raw: data }; }

          if (evt === 'session' && parsed.sessionId && !sessionId) {
            setSessionId(parsed.sessionId);
            sessionStorage.setItem('chat_session', parsed.sessionId);
          } else if (evt === 'iteration_start') {
            localTrace.push({ kind: 'iteration', iteration: parsed.iteration });
            setTrace([...localTrace]);
          } else if (evt === 'tool_call') {
            localTrace.push({ kind: 'tool_call', toolName: parsed.toolName, toolArgs: parsed.toolArgs });
            setTrace([...localTrace]);
          } else if (evt === 'tool_result') {
            // attach result to the matching tool_call entry
            for (let i = localTrace.length - 1; i >= 0; i--) {
              if (localTrace[i].kind === 'tool_call' && localTrace[i].toolName === parsed.toolName && !localTrace[i].toolResult) {
                localTrace[i] = { ...localTrace[i], toolResult: parsed.toolResult };
                break;
              }
            }
            setTrace([...localTrace]);
          } else if (evt === 'assistant_delta') {
            localTrace.push({ kind: 'thought', content: parsed.content });
            setTrace([...localTrace]);
          } else if (evt === 'final') {
            finalAnswer = parsed.answer || '';
          } else if (evt === 'done') {
            if (!finalAnswer && parsed.answer) finalAnswer = parsed.answer;
          } else if (evt === 'error') {
            throw new Error(parsed.error || 'stream error');
          }
        }
      }

      setMsgs(m => [...m, {
        role: 'assistant',
        text: finalAnswer || '(no response)',
        ts: Date.now(),
        trace: localTrace.length ? localTrace : undefined,
      }]);
    } catch (err) {
      setMsgs(m => [...m, { role: 'error', text: 'Error: ' + err.message, ts: Date.now() }]);
    } finally {
      setThinking(false);
      setTrace([]);
    }
  };

  const newChat = () => {
    if (msgs.length && !confirm('Start a new chat? Current conversation will be cleared.')) return;
    setMsgs([]); setSessionId(null); setTrace([]); setAttachments([]);
    sessionStorage.removeItem('chat_msgs'); sessionStorage.removeItem('chat_session');
  };

  const renderTrace = (items, compact = false) => e('div', { className: 'space-y-1' }, items.map((it, i) => {
    if (it.kind === 'iteration') return e('div', { key: i, className: 'text-[10px] uppercase tracking-wider text-gray-600 mono' }, 'iteration ', it.iteration);
    if (it.kind === 'thought') return e('div', { key: i, className: 'text-sm text-gray-400 italic border-l-2 border-bg-600 pl-2' }, it.content);
    if (it.kind === 'tool_call') {
      const done = !!it.toolResult;
      return e('details', { key: i, className: 'bg-bg-800 border border-bg-700 rounded-lg overflow-hidden', open: !compact && !done },
        e('summary', { className: 'px-3 py-1.5 text-sm cursor-pointer flex items-center gap-2 hover:bg-bg-700/50' },

// ---------- MCP ----------
function McpPanel() {
  const [servers, , reload] = useFetch('/api/mcp');
  const [adding, setAdding] = React.useState(false);
  const [form, setForm] = React.useState({ name: '', command: '', args: '', env: '' });

  const reconnect = async name => { try { await api('/api/mcp/' + name + '/reconnect', { method: 'POST' }); toast('Reconnecting…'); setTimeout(reload, 1500); } catch (err) { toast(err.message, 'error'); } };
  const remove = async name => { if (!confirm('Remove MCP server "' + name + '"?')) return; try { await api('/api/mcp/' + encodeURIComponent(name), { method: 'DELETE' }); toast('Removed', 'success'); reload(); } catch (err) { toast(err.message, 'error'); } };
  const add = async () => {
    if (!form.name || !form.command) return toast('Name + command required', 'error');
    const argsArr = form.args.split('\n').map(s => s.trim()).filter(Boolean);
    let envObj = undefined;
    if (form.env.trim()) {
      envObj = {};
      for (const line of form.env.split('\n')) {
        const i = line.indexOf('=');
        if (i > 0) envObj[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      }
    }
    try {
      await api('/api/mcp', { method: 'POST', body: JSON.stringify({ name: form.name, command: form.command, args: argsArr, env: envObj }) });
      toast('Added', 'success'); setAdding(false); setForm({ name: '', command: '', args: '', env: '' }); reload();
    } catch (err) { toast(err.message, 'error'); }
  };

  const QUICK_ADDS = [
    { name: 'filesystem', command: 'npx', args: '-y\n@modelcontextprotocol/server-filesystem\n' + (navigator.platform.startsWith('Win') ? 'C:\\\\' : '/'), desc: 'Sandboxed file ops' },
    { name: 'fetch', command: 'uvx', args: 'mcp-server-fetch', desc: 'Fetch URLs as markdown' },
    { name: 'time', command: 'uvx', args: 'mcp-server-time', desc: 'Timezones + current time' },
    { name: 'sqlite', command: 'uvx', args: 'mcp-server-sqlite\n--db-path\n~/.polymath/scratch.db', desc: 'Scratch SQLite database' },
  ];

  if (!servers) return e('div', { className: 'p-6 text-gray-500' }, 'Loading…');
  return e('div', { className: 'p-6 space-y-4 max-w-4xl' },
    e('div', { className: 'flex items-center justify-between' },
      e('h2', { className: 'text-xl font-semibold' }, 'MCP Servers'),
      e('button', { onClick: () => setAdding(true), className: 'bg-accent hover:bg-accent-hover text-bg-900 font-medium rounded-lg px-3 py-1.5 text-sm flex items-center gap-1' }, e(Icon.Plus, { className: 'w-4 h-4' }), 'Add Server')
    ),
    e('p', { className: 'text-sm text-gray-500' }, 'MCP (Model Context Protocol) servers are stdio subprocesses that expose additional tools. Add local binaries, Python scripts, or Node packages.'),

    !servers.length ? e('div', { className: 'text-sm text-gray-500 text-center py-8 bg-bg-800 border border-bg-700 rounded-xl' }, 'No MCP servers — add one to expose extra tools') :
      e('ul', { className: 'space-y-2' }, servers.map((s, i) =>
        e('li', { key: i, className: 'bg-bg-800 border border-bg-700 rounded-xl p-4 flex items-center justify-between' },
          e('div', null,
            e('div', { className: 'font-semibold mono' }, s.name),
            e('div', { className: 'text-sm text-gray-500' }, s.tools, ' tools exposed')
          ),
          e('div', { className: 'flex items-center gap-2' },
            e('span', { className: 'text-xs mono ' + (s.health === 'connected' ? 'text-green-400' : 'text-red-400') }, s.health),
            e('button', { onClick: () => reconnect(s.name), className: 'text-xs bg-bg-700 hover:bg-bg-600 border border-bg-600 rounded-md px-3 py-1' }, 'Reconnect'),
            e('button', { onClick: () => remove(s.name), className: 'text-xs text-red-400 hover:text-red-300 p-1' }, e(Icon.Trash, { className: 'w-4 h-4' }))
          )
        )
      )),

    adding && e('div', { className: 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-6', onClick: () => setAdding(false) },
      e('div', { className: 'bg-bg-800 border border-bg-700 rounded-xl p-6 w-full max-w-xl space-y-4', onClick: ev => ev.stopPropagation() },
        e('h3', { className: 'text-lg font-semibold' }, 'Add MCP Server'),
        e('div', null,
          e('div', { className: 'text-xs text-gray-500 uppercase tracking-wide mb-2' }, 'Quick adds'),
          e('div', { className: 'grid grid-cols-2 gap-2' }, QUICK_ADDS.map(q =>
            e('button', { key: q.name, onClick: () => setForm({ name: q.name, command: q.command, args: q.args, env: '' }), className: 'text-left p-2 rounded-lg bg-bg-700 hover:bg-bg-600 border border-bg-600' },
              e('div', { className: 'mono text-sm' }, q.name),
              e('div', { className: 'text-xs text-gray-500' }, q.desc)
            )
          ))
        ),
        e('div', { className: 'space-y-3' },
          e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Name'), e('input', { value: form.name, onChange: ev => setForm(f => ({ ...f, name: ev.target.value })), placeholder: 'my-server', className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim' })),
          e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Command'), e('input', { value: form.command, onChange: ev => setForm(f => ({ ...f, command: ev.target.value })), placeholder: 'uvx', className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim' })),
          e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Args (one per line)'), e('textarea', { value: form.args, onChange: ev => setForm(f => ({ ...f, args: ev.target.value })), rows: 4, className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim' })),
          e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Env vars (KEY=VAL per line, optional)'), e('textarea', { value: form.env, onChange: ev => setForm(f => ({ ...f, env: ev.target.value })), rows: 3, placeholder: 'API_KEY=...', className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim' }))
        ),
        e('div', { className: 'flex gap-2 justify-end' },
          e('button', { onClick: () => setAdding(false), className: 'px-3 py-1.5 rounded-md text-sm text-gray-400 hover:text-white' }, 'Cancel'),
          e('button', { onClick: add, className: 'bg-accent hover:bg-accent-hover text-bg-900 font-medium rounded-lg px-4 py-1.5 text-sm' }, 'Add + Start')
        )
      )
    ),

    // Media-memory quick action
    servers.some(s => s.name === 'media-memory') && e('div', { className: 'bg-bg-800 border border-bg-700 rounded-xl p-5 space-y-3' },
      e('h3', { className: 'font-semibold flex items-center gap-2' }, e(Icon.Play, { className: 'w-4 h-4 text-accent' }), 'Quick: Index Media'),
      e('p', { className: 'text-sm text-gray-500' }, 'Index a folder of videos/photos with GPU CLIP embeddings via the C++ media-memory capability. Follow ', e('code', { className: 'mono text-accent' }, 'content/<brand>/<category>/'), ' for auto-tagging.'),
      e(IndexMediaForm)
    )
  );
}

function IndexMediaForm() {
  const [path, setPath] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const run = async () => {
    if (!path) return toast('Path required', 'error');
    setBusy(true);
    try {
      const r = await api('/api/actions/invoke', { method: 'POST', body: JSON.stringify({ tool: 'media-memory.index', args: { path } }) });
      toast('Indexing started: ' + JSON.stringify(r.result).slice(0, 100), 'success');
    } catch (err) { toast(err.message, 'error'); }
    finally { setBusy(false); }
  };
  return e('div', { className: 'flex gap-2' },
    e('input', { value: path, onChange: ev => setPath(ev.target.value), placeholder: 'D:\\AGENT\\content\\brand-a\\reels', className: 'flex-1 bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim' }),

  );
}

    { label: 'Gateway HTTP', status: data.gateway },

  (data.mcp_servers || []).forEach(s => checks.push({ label: 'MCP: ' + s.name, status: s.health === 'connected' ? 'ok' : s.health }));
  return e('div', { className: 'p-6 space-y-4 max-w-3xl' },

function MediaPreview({ item, mode = 'thumb' }) {
  const [url, setUrl] = React.useState('');
  React.useEffect(() => {
    let alive = true;
    let objectUrl = '';
    setUrl('');
    if (!item?.id || !['image', 'video', 'audio'].includes(item.kind)) return;
    authedBlobUrl(mediaPlayablePath(item))
      .then(u => {
        objectUrl = u;
        if (alive) setUrl(u);
        else URL.revokeObjectURL(u);
      })
      .catch(() => { if (alive) setUrl(''); });
    return () => {
      alive = false;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    };
  }, [item?.id, item?.kind]);

  const base = mode === 'detail'
    ? 'w-full bg-bg-900 border border-bg-700 rounded-lg overflow-hidden'
    : 'w-16 h-16 bg-bg-900 border border-bg-700 rounded-md overflow-hidden flex-shrink-0';

  const box = (...children) => e('div', { className: base + (mode === 'thumb' ? ' flex items-center justify-center' : '') }, ...children);

  if (!['image', 'video', 'audio'].includes(item?.kind)) {
    return box(e('span', { className: 'text-xs text-gray-600 mono' }, item?.kind || 'file'));
  }
  if (!url) return box(e('div', { className: 'w-full h-full pulse-dot' }));

  if (item.kind === 'image') {
    return box(e('img', {
      src: url,
      className: mode === 'detail' ? 'w-full max-h-[420px] object-contain bg-black' : 'w-full h-full object-cover',
      loading: 'lazy',
    }));
  }
  if (item.kind === 'video') {
    return box(e('video', {
      src: url,
      controls: mode === 'detail',
      muted: mode !== 'detail',
      className: mode === 'detail' ? 'w-full max-h-[420px] bg-black' : 'w-full h-full object-cover',
    }));
  }
  return box(e('audio', { src: url, controls: true, className: 'w-full' }));
}

// ---------- GPU ----------
function GpuPanel() {
  const [state, setState] = React.useState(null);
  const [form, setForm] = React.useState({ owner: '', reason: '', hold: 60 });
  const load = () => api('/api/gpu/state').then(setState).catch(() => setState({ dormant: true }));
  React.useEffect(() => { load(); const id = setInterval(load, 5000); return () => clearInterval(id); }, []);

  const claim = async () => {
    if (!form.owner) return toast('Owner label required', 'error');
    try {
      const r = await api('/api/gpu/claim', { method: 'POST', body: JSON.stringify({ owner: form.owner, reason: form.reason, hold_minutes: form.hold }) });
      if (r.ok) toast('GPU claimed · token ' + (r.token || '').slice(0, 8), 'success');
      else toast(r.error || 'claim failed', 'error');
      load();
    } catch (err) { toast(err.message, 'error'); }
  };
  const forceRelease = async () => {
    try { const r = await api('/api/gpu/release', { method: 'POST', body: JSON.stringify({ token: 'force' }) }); toast(r.ok ? 'Released' : r.error, r.ok ? 'success' : 'error'); load(); }
    catch (err) { toast(err.message, 'error'); }
  };
  const evacuate = async () => {
    try { await api('/api/gpu/evacuate', { method: 'POST' }); toast('Ollama evacuated from VRAM', 'success'); load(); }
    catch (err) { toast(err.message, 'error'); }
  };

  if (!state) return e('div', { className: 'p-6 text-gray-500' }, 'Loading…');
  if (state.dormant) return e('div', { className: 'p-6 max-w-2xl' },
    e('h2', { className: 'text-xl font-semibold mb-2' }, 'GPU Broker'),
    e('div', { className: 'bg-bg-800 border border-bg-700 rounded-xl p-5 text-sm text-gray-400' },
      'GPU broker is dormant. You are using a cloud LLM provider (', e('code', { className: 'mono text-accent' }, 'openai/anthropic/google/…'), '), so there is nothing to arbitrate locally.',
      e('div', { className: 'mt-3' }, 'Switch to Ollama or LM Studio in Settings to enable GPU lease management.')
    )
  );

  const used = state.vram_used_mb ?? 0;
  const total = state.vram_total_mb ?? 1;
  const pct = Math.min(100, Math.round(used / total * 100));
  const statusColor = state.status === 'idle' ? 'text-green-400' : state.status === 'user-claimed' ? 'text-yellow-400' : state.status === 'draining' ? 'text-orange-400' : 'text-accent';

  return e('div', { className: 'p-6 space-y-4 max-w-4xl' },
    e('h2', { className: 'text-xl font-semibold' }, 'GPU Broker'),
    e('p', { className: 'text-sm text-gray-500' }, 'Arbitrates local VRAM between Polymath and other GPU-heavy processes (video editing, upscalers, peer agents). Polymath evacuates automatically when an external workload takes over.'),

    e('div', { className: 'bg-bg-800 border border-bg-700 rounded-xl p-5' },
      e('div', { className: 'flex items-center justify-between mb-3' },
        e('div', null,
          e('div', { className: 'text-xs text-gray-500 uppercase tracking-wide' }, 'Status'),
          e('div', { className: 'text-2xl font-semibold mono ' + statusColor }, state.status)
        ),
        state.owner && e('div', { className: 'text-right' },
          e('div', { className: 'text-xs text-gray-500 uppercase tracking-wide' }, 'Holder'),
          e('div', { className: 'mono text-accent' }, state.owner),
          state.reason && e('div', { className: 'text-xs text-gray-500 mt-0.5' }, state.reason),
          state.expires_at && e('div', { className: 'text-xs text-gray-600 mono' }, 'expires: ', new Date(state.expires_at).toLocaleTimeString())
        )
      ),
      e('div', { className: 'flex items-center gap-3 text-sm' },
        e('div', { className: 'flex-1' },
          e('div', { className: 'flex items-center justify-between text-xs mono text-gray-500 mb-1' },
            e('span', null, 'VRAM ', used, ' / ', total, ' MB'),
            e('span', null, pct + '%')
          ),
          e('div', { className: 'h-2 bg-bg-700 rounded-full overflow-hidden' },
            e('div', { className: 'h-full bg-gradient-to-r from-accent-dim to-accent transition-all', style: { width: pct + '%' } })
          )
        )

      state.loaded_models && state.loaded_models.length > 0 && e('div', { className: 'mt-3 text-xs' },

    api('/api/auth/codex/status')
      .then(s => setCodexStatus({ ...s, loading: false }))
      .catch(err => setCodexStatus({ configured: false, loading: false, error: err.message }));
  }, []);

  React.useEffect(() => {
    reloadCodexStatus();
    const id = setInterval(reloadCodexStatus, 5000);
    return () => clearInterval(id);
  }, [reloadCodexStatus]);

  const pickProvider = (p) => {
    setProvider(p.id);
    if (p.defaultUrl && !baseUrl) setBaseUrl(p.defaultUrl);
    if (p.defaultModel) setModel(p.defaultModel);
  };

  const save = async () => {
    setSaving(true);
    try {
      await api('/api/settings/llm', { method: 'POST', body: JSON.stringify({ provider, model, base_url: baseUrl, api_key: apiKey === '***' ? undefined : apiKey, temperature: parseFloat(temp) }) });
      toast('Saved and hot-swapped', 'success');
      onLlmChange?.();
      reload();
    } catch (err) { toast(err.message, 'error'); }
    finally { setSaving(false); }
  };

  const selected = PROVIDERS.find(p => p.id === provider);
  const codexActive = provider === 'openai-codex';
  const codexConfigured = codexStatus?.configured || codexActive;
  const codexState = codexStatus?.state || (codexActive ? 'active' : codexStatus?.loading ? 'checking' : 'missing');
  const codexDetail = codexStatus?.configured
    ? (codexStatus.account_id + ' · ' + codexStatus.state + ' · ' + codexStatus.age_minutes + 'm')
    : codexActive
      ? ('active provider · ' + (model || 'gpt-5.5'))
      : (codexStatus?.loading ? 'checking auth status' : (codexStatus?.error || 'not configured'));

  return e('div', { className: 'p-6 space-y-6 max-w-3xl' },
    e('h2', { className: 'text-xl font-semibold' }, 'Settings'),

    e('div', { className: 'bg-bg-800 border border-bg-700 rounded-xl p-5 space-y-4' },
      e('div', null,
        e('h3', { className: 'font-semibold mb-1' }, 'LLM Provider'),
        e('p', { className: 'text-sm text-gray-500' }, 'Changes apply immediately — no restart. Local providers are free.')
      ),
      e('div', { className: 'bg-bg-900 border border-bg-700 rounded-lg p-3 flex items-center justify-between text-sm' },
        e('div', null,
          e('div', { className: 'font-medium' }, 'Codex / ChatGPT auth'),
          e('div', { className: 'text-xs text-gray-500 mono' },
            codexDetail
          )
        ),
        e('div', { className: 'flex items-center gap-2' },
          e('button', { onClick: reloadCodexStatus, className: 'bg-bg-700 hover:bg-bg-600 border border-bg-600 rounded-md px-2 py-1 text-xs' }, 'Refresh'),
          e('span', { className: 'text-xs mono px-2 py-1 rounded ' + (codexConfigured ? 'bg-green-500/15 text-green-300' : 'bg-yellow-500/15 text-yellow-300') },
            codexState
          )
        )
      ),
      e('div', { className: 'grid grid-cols-2 md:grid-cols-3 gap-2' }, PROVIDERS.map(p =>
        e('button', {
          key: p.id, onClick: () => pickProvider(p),
          className: 'px-3 py-2 rounded-lg border text-sm text-left ' + (provider === p.id ? 'border-accent bg-accent/10 text-accent' : 'border-bg-700 bg-bg-700/50 text-gray-300 hover:border-bg-600'),
        },
          e('div', { className: 'flex items-center justify-between' }, e('span', { className: 'font-medium' }, p.label), e('span', { className: 'text-[10px] uppercase mono ' + (p.tag === 'local' ? 'text-green-400' : p.tag === 'cloud' ? 'text-blue-400' : 'text-gray-500') }, p.tag)),
          e('div', { className: 'text-xs text-gray-500 mt-0.5' }, p.notes)
        )
      )),

      e('div', { className: 'grid grid-cols-2 gap-3' },
        e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Base URL'),
          e('input', { value: baseUrl, onChange: ev => setBaseUrl(ev.target.value), className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim', placeholder: selected?.defaultUrl || 'https://…' })),
        e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'API Key'),
          e('input', { type: 'password', value: apiKey, onChange: ev => setApiKey(ev.target.value), className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim', placeholder: '(blank for local)' })),
        e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Model'),
          e('input', { value: model, onChange: ev => setModel(ev.target.value), className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim', placeholder: 'qwen2.5-coder:7b' })),
        e('div', null, e('label', { className: 'text-xs text-gray-500 uppercase tracking-wide block mb-1' }, 'Temperature'),
          e('input', { type: 'number', step: '0.1', min: '0', max: '2', value: temp, onChange: ev => setTemp(ev.target.value), className: 'w-full bg-bg-700 border border-bg-600 rounded-lg px-3 py-1.5 text-sm mono outline-none focus:border-accent-dim' }),
          e('p', { className: 'text-[10px] text-gray-600 mt-0.5' }, '0 = deterministic, 1 = balanced, 2 = chaotic'))
      ),
      e('div', { className: 'flex items-center gap-3' },
        e('button', { onClick: save, disabled: saving, className: 'bg-accent hover:bg-accent-hover text-bg-900 font-medium rounded-lg px-4 py-2 text-sm disabled:opacity-50' }, saving ? 'Saving…' : 'Apply')
      )
    ),

    data && e('details', { className: 'bg-bg-800 border border-bg-700 rounded-xl' },
      e('summary', { className: 'px-4 py-3 cursor-pointer text-sm font-medium text-gray-400' }, 'Raw config (~/.polymath/polymath.json, secrets redacted)'),
      e('pre', { className: 'px-4 pb-4 text-xs mono overflow-auto max-h-96 scrollbar-thin' }, JSON.stringify(data, null, 2))
    )
  );
}

// ---------- App ----------
const PANELS = {
  Chat: ChatPanel, Dashboard: DashboardPanel, Tools: ToolsPanel, Sessions: SessionsPanel,
  Skills: SkillsPanel, Cron: CronPanel, Memory: MemoryPanel, Media: MediaPanel, Channels: ChannelsPanel,
  MCP: McpPanel, GPU: GpuPanel, Audit: AuditPanel, Doctor: DoctorPanel, Settings: SettingsPanel,
};

function App() {
  const [tab, setTab] = React.useState(() => localStorage.getItem('polymath_tab') || 'Chat');
  const [doctor, setDoctor] = React.useState(null);
  const [llmInfo, setLlmInfo] = React.useState(null);
  const [refreshKey, setRefreshKey] = React.useState(0);

  const reloadLlm = React.useCallback(() => {
    api('/api/models').then(d => setLlmInfo({ provider: d.provider, model: d.current })).catch(() => {});
    setRefreshKey(k => k + 1);
  }, []);

  React.useEffect(() => {
    const tick = () => { api('/api/doctor').then(setDoctor).catch(() => {}); };
    tick(); const id = setInterval(tick, 10000); return () => clearInterval(id);
  }, []);
  React.useEffect(() => { reloadLlm(); }, [reloadLlm]);
  React.useEffect(() => { localStorage.setItem('polymath_tab', tab); }, [tab]);

  const Panel = PANELS[tab];

  return e('div', { className: 'flex h-screen' },
    e('aside', { className: 'w-60 flex flex-col bg-bg-800 border-r border-bg-700 flex-shrink-0' },
      e(Logo),
      e('nav', { className: 'flex-1 overflow-y-auto scrollbar-thin py-2' }, NAV.map(n =>
        e('button', {
          key: n.id, onClick: () => setTab(n.id),
          className: 'w-full flex items-center gap-3 px-4 py-2 text-sm transition-colors ' + (tab === n.id ? 'bg-accent/15 text-accent border-l-2 border-accent' : 'text-gray-400 hover:text-white hover:bg-bg-700/50 border-l-2 border-transparent'),
        }, e(n.icon), n.label)
      )),
      e(StatusBar, { doctor })
    ),
    e('main', { className: 'flex-1 flex flex-col min-w-0' },
      e('header', { className: 'flex items-center justify-between px-6 py-3 border-b border-bg-700 flex-shrink-0' },
        e('div', { className: 'text-sm text-gray-400' },
          e('span', { className: 'mono text-xs text-gray-600' }, 'gateway '),
          e('span', { className: 'text-accent mono text-xs' }, 'localhost:18789')
        ),
        e(ModelPicker, { current: llmInfo, onChange: reloadLlm })
      ),
      e('div', { key: tab + '-' + refreshKey, className: 'flex-1 overflow-y-auto scrollbar-thin min-h-0' },
        tab === 'Settings' ? e(Panel, { onLlmChange: reloadLlm }) : e(Panel)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
