name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: polymath-ts-linux-x64
          - os: windows-latest
            target: polymath-ts-windows-x64.exe
          - os: macos-latest
            target: polymath-ts-macos-arm64
    defaults:
      run:
        working-directory: core-ts
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - run: deno task build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: core-ts/dist/*

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
